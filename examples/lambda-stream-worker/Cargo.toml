[package]
name = "lambda-stream-worker"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"
# cargo-lambda requires the binary to be named `bootstrap`; all three
# Lambda example crates declare the same name. Exclude from rustdoc so
# `cargo doc --workspace` does not collide on the output filename.
doc = false

[dependencies]
turul-a2a = { workspace = true }
turul-a2a-aws-lambda = { workspace = true }
turul-a2a-types = { workspace = true }
turul-a2a-proto = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
lambda_runtime = { workspace = true }
aws_lambda_events = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
