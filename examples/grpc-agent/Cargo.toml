[package]
name = "grpc-agent"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "grpc-agent"
path = "src/main.rs"

[[bin]]
name = "grpc-client"
path = "src/bin/grpc_client.rs"

[dependencies]
turul-a2a = { workspace = true, features = ["grpc"] }
turul-a2a-client = { workspace = true, features = ["grpc"] }
turul-a2a-proto = { workspace = true, features = ["grpc"] }
turul-a2a-types = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio-stream = { workspace = true, features = ["net"] }
