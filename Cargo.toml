[workspace]
resolver = "3"
members = [
  "crates/turul-a2a-proto",
  "crates/turul-a2a-types",
  "crates/turul-a2a",
  "crates/turul-a2a-auth",
  "crates/turul-a2a-client",
  "crates/turul-a2a-aws-lambda",
  "crates/turul-a2a-patterns",
  "examples/echo-agent",
  "examples/auth-agent",
  "examples/streaming-agent",
  "examples/callback-agent",
  "examples/grpc-agent",
  "examples/skill-security-agent",
  "examples/skill-manifest-ollama-agent",
  "examples/agent-role-planner-router-agent",
  "examples/skill-dispatch-profile-agent",
  "examples/agent-role-critic-agent",
  "examples/post-task-hook-agent",
  "examples/remote-delegate-agent",
  "examples/conversation-agent",
  "examples/interrupting-agent",
  "examples/lambda-agent",
  "examples/lambda-durable-agent",
  "examples/lambda-durable-single",
  "examples/lambda-durable-worker",
  "examples/lambda-stream-worker",
  "examples/lambda-scheduled-worker",
  "examples/interop-clients/skill-manifest-ollama/rust",
  "examples/interop-clients/skill-dispatch-profile/rust",
  "examples/interop-clients/agent-role-planner-router/rust",
  "examples/interop-clients/agent-role-critic/rust",
  "examples/interop-clients/post-task-hook/rust",
  "examples/interop-clients/remote-delegate/rust",
]

[workspace.package]
version = "0.1.26"
edition = "2024"
authors = ["Nick Hortovanyi <nick@aussierobots.com.au>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aussierobots/turul-a2a"
homepage = "https://github.com/aussierobots/turul-a2a"
keywords = ["a2a", "agent", "protocol", "async", "tokio"]
categories = ["network-programming", "asynchronous", "web-programming::http-server", "api-bindings"]
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = "2"
tracing = "0.1"

# Proto dependencies
prost = "0.14"
prost-types = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"

# gRPC (ADR-014; feature-gated, default off)
tonic = "0.14"
tonic-prost = "0.14"
tonic-types = "0.14"
tonic-reflection = "0.14"
tonic-health = "0.14"
tonic-prost-build = "0.14"
tonic-build = "0.14"

# Internal
# HTTP server
axum = { version = "0.8", features = ["json"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
hyper = "1"
http = "1"
http-body-util = "0.1"

# Auth / JWT
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }

# Local-environment loading for example agents — opt-in per crate
dotenvy = "0.15"

# Secrets — kept out of turul-a2a-types so the protocol/types crate stays lightweight
secrecy = "0.10"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "postgres", "json"] }
aws-config = "1"
aws-sdk-dynamodb = "1"

# Lambda
lambda_http = "1"
lambda_runtime = "1"
aws_lambda_events = { version = "1.2", default-features = false, features = ["dynamodb", "eventbridge", "sqs"] }
aws-sdk-sqs = "1"

# Testing / crypto
rsa = { version = "0.9", features = ["pem"] }
rand = "0.10"
base64 = "0.22"
wiremock = "0.6"
static_assertions = "1.1"

# Misc
bytes = "1"

# turul-a2a-patterns (publish = false) — YAML frontmatter + JSON Schema 2020-12 validation.
# Confined to the internal patterns crate; not pulled in by any publishable crate (ADR-021 §2.1).
# serde_yaml is upstream-deprecated but remains the most-tested YAML/Serde option; switching to
# a fork would add risk without offsetting value while this crate stays publish = false.
# jsonschema supports Draft 2020-12 and is the most widely used Rust validator.
serde_yaml = "0.9"
jsonschema = "0.46"

turul-a2a = { version = "0.1.26", path = "crates/turul-a2a" }
turul-a2a-proto = { version = "0.1.26", path = "crates/turul-a2a-proto" }
turul-a2a-types = { version = "0.1.26", path = "crates/turul-a2a-types" }
turul-a2a-client = { path = "crates/turul-a2a-client" }
# Path-only per ADR-021 §2.1 — not publishable, not a [dependencies] of any publishable crate.
turul-a2a-patterns = { path = "crates/turul-a2a-patterns" }
turul-jwt-validator = "0.2"

# Sibling repo turul-llm — provider-neutral LLM client abstraction +
# adapters. Published to crates.io as of 2026-05-23 at v0.1.0; consumed
# here via versioned deps.
#
# Consumed only by example agents in this workspace. Core publishable
# crates (turul-a2a, turul-a2a-types, turul-a2a-proto, turul-a2a-client,
# turul-a2a-auth, turul-a2a-aws-lambda) MUST NOT depend on turul-llm-*
# — the framework stays provider-neutral. See docs/adr/ADR-023.
turul-llm-core = "0.1"
turul-llm-ollama = "0.1"

# Generic JSON-RPC 2.0 framework. We use the dispatcher + handler trait for
# the inner non-streaming dispatch table; the outer wire boundary stays in
# turul-a2a (parse, envelope validation, notifications, params shape, compat-
# v03, method-not-found wording, streaming, batch).
turul-rpc = { version = "0.1", default-features = false, features = ["async"] }
